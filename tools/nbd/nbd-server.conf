# The same exports for the standard nbd-server (Debian/Ubuntu/Arch: package nbd-server), if a host has it:
#   nbd-server -C tools/nbd/nbd-server.conf
# A host without it: tools/nbd/nbd-server.py is the server there (python3 alone). The kernel's client
# (bsd/dev/vayu_nbd.c) speaks to either: nbd=1 nbd_host=10.11.0.1 nbd_port=10809 nbd_export=NAME.
#
# Read only, as nbd-server.py is by default. nbd-server's own "copyonwrite = true" is NOT nbd-server.py --cow: its
# overlay belongs to one connection and is thrown away when that connection ends -- and the kernel reconnects
# after a broken cable or a restarted server, so what was written would be gone under a mounted file system.
# For a writable data volume use nbd-server.py --cow, or a copy of the image with "readonly = false".
[generic]
	listenaddr = 10.11.0.1
	port = 10809
	allowlist = true

# a root for root_apfs=nbd0 (init mounts it as the iOS volume); the paths are examples: where the images lie on the host
[ios27]
	exportname = /srv/hakios/ios27-root.img
	readonly = true
	flush = true

[macos13]
	exportname = /srv/hakios/macos13-full.img
	readonly = true
	flush = true
