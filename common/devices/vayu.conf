# POCO X3 Pro (vayu) — Snapdragon 860.
# Generated by common/new-device.sh from Mu-Silicium Resources/DTBs/vayu.dtb,
# then filled from vayuPkg's MemoryMapLib. Values marked HYPOTHESIS still need
# the loader's "display ... at" log or the UEFI memory map on real hardware.

NAME="POCO X3 Pro (vayu)"
KIND=phone
SOC="Qualcomm Snapdragon 860 (SM8150-AC)"

# --- boot chain (phones) ---------------------------------------------------------------------------
UEFI_TARGET=vayu
UEFI_FD=                        # empty: Mu-Silicium/Build/vayuPkg/... or prebuilt/uefi (not built yet)
DTB=uefi/files/Resources/DTBs/vayu.dtb
FD_BASE=0x9FC00000              # Resources/Configs/vayu.toml + vayuPkg "UEFI FD" region
FD_SIZE=0x300000                # same: vayu.toml uefi_fd.size
PAYLOAD_BASE=0xF0000000         # XnuLoader.h fixed base; inside free RAM above the UEFI map

# --- kernel and loader -----------------------------------------------------------------------------
FB_BASE=0x9C000000              # FACT: loader on 11cc4e72 printed "display 1080 x 2400 at 9c000000"
WIFI_ATH11K=0                   # vayu is Wi-Fi 5 (likely WCN3990/ath10k), not WCN6750

# --- what the run needs ----------------------------------------------------------------------------
# No cpufreq=1 yet: redwood's EPSS/clock addresses are not vayu's.
# No touchscreen=1 yet: vayu has a Novatek NVT-ts-spi panel, not redwood's
# Goodix GT9916, so redwood_goodix_init() would probe the wrong controller.
# SM8150 wires the arch-timer virtual PPI to 3 (INTID 19); redwood/QEMU use 27.
BOOTARGS="bootcpu=7 cpus=8 vtimer_intid=19"
DEFAULT_SECS=900
USERLAND_VARS=""
# The phone's own firmware, taken from its Android (never in the repository): see docs/PORTING.md.
FIRMWARE=""
