# /redwood/etc/hakios-tunnel.conf -- what /redwood/bin/tunnel (launchd job com.hakios.tunnel) connects to.
#
# The image is mounted on /redwood, so its /etc is /redwood/etc here; /etc is the iOS volume's.
# (The program also reads /etc/hakios-tunnel.conf, for a boot where this image itself is the root,
# and this file then wins.)
#
# The values below are the program's own defaults; uncomment a line to change one.  A boot
# argument wins over nothing but the default, and this file wins over the boot argument.
# There is no host by default (the lab host is yours): without host= or tunnel_host= the program
# does nothing.  userland/build.sh puts ../ssh/hakios-tunnel.conf (outside git, beside the key) here
# instead of this file when there is one.
#   tunnel_host=HOST  tunnel_port=22022  tunnel_ssh_port=22  tunnel_user=USER
#   tunnel_key=/var/root/.ssh/vayu_tunnel_ed25519  tunnel_ssh=/var/jb/usr/bin/ssh
#   tunnel_iface=en0
#
# host:         where ssh is made to (the lab host; the phone must be able to reach its ssh port).
# port:         the port sshd on the host listens on for us, on 127.0.0.1 only (the key's
#               permitlisten="127.0.0.1:22022" is what allows it).
# ssh_port:     the host's own ssh port, which is what "reachable" checks.
# user:         the account on the host (its authorized_keys holds the restricted entry for the key);
#               none: ssh's own default.
# key:          the private key, 0600 root, put in /private/var by init from /etc/var.skel.
# ssh:          the OpenSSH client; the Procursus prefix is grafted at /var/jb by init.
# iface:        preferred interface for the IPv4 address; any non-loopback one is used if it has none.
# local:        address:port on this phone that the host's port is forwarded to (the phone's sshd).
# interval:     seconds between attempts while there is no address or the host does not answer.
#
#host=
#port=22022
#ssh_port=22
#user=
#key=/var/root/.ssh/vayu_tunnel_ed25519
#ssh=/var/jb/usr/bin/ssh
#iface=en0
#local=127.0.0.1:22
#interval=5
