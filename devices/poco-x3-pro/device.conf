# devices/poco-x3-pro/device.conf: what this device is, and how far each part of it works, in the words of the common
# repository's device.conf (docs/porting/repositories.md there). This tree predates the common repository's configs/, so there
# is no defconfig line yet; the boot arguments in the notes are what turns each part on.
#
# A status is what was seen on the phone (POCO X3 Pro, 8/256 GB) on the lab's builds k17 to k33-daily, 2026-10-26 to
# 2026-11-06; on 2026-11-18 k33-daily rebuilt from its patches showed the boot to SpringBoard, LTE registration, Bluetooth,
# a DHCP address on Wi-Fi and the cameras again, and the merged kernel of this line SpringBoard, LTE and DHCP in a 1368 s
# run. The README of this directory has the evidence for each line. `works` only for what was seen working on the phone;
# what is written and not seen, or seen in part, is `partial` with what is missing; what does not work is `missing`.

device vayu
	title       POCO X3 Pro
	vendor      Xiaomi
	soc         sm8150
	firmware    pull-firmware.sh
	maintainer  nomorecoolnicknames (README.md)
	status      display     works     the panel through UEFI's framebuffer at 120 Hz (fb_120=1, vayu_vsync=1); smoothness under the finger not confirmed
	status      touch       partial   Novatek NT36675 on QUP SPI, multitouch (touchscreen=1 nvt_qup=1); apps get about 30 events/s on a continuous drag
	status      buttons     works     power and volume keys
	status      cpu         works     all 8 cores, OSM frequency tables (bootcpu=7 cpus=8 cpufreq=1 cpufreq_vayu=1)
	status      gpu         partial   Adreno 640, OpenGL ES through Mesa freedreno draws SpringBoard (gpu=1 vayu_gpu=1 vayu_keep=1); no Metal
	status      storage     partial   UFS read; /private/var saved across a reboot in a partition of its own (var_store=1 ufs_write=1); no local storage in Files
	status      audio       partial   speaker playback and the microphone (vayu_audio=1 vayu_sound=1 vayu_mic=1); the headphone jack is silent
	status      battery     partial   level and charger state in the UI; the phone drains on USB under load (vayu_sdp_slow=0), charging not shown
	status      haptic      partial   a test pulse is felt (vayu_haptic=1); no iOS route to it
	status      camera      partial   main camera (IMX582) live in Camera.app, about 30 fps with vayu_sdp_slow=0; stills about 2 MP; ultra-wide frames dark
	status      torch       partial   PM8150L flash LED driver (hakios.torch.c); not re-checked on the k30-k33 builds
	status      wifi        partial   WCN3990: 5 GHz WPA2 join, DHCP and a page in Safari (vayu_wifi=1 ...); one run dropped at group rekey; 2.4 GHz not tested
	status      bluetooth   partial   WCN3998: the switch on and two devices found in Settings (vayu_bt=1 vayu_bt_dt=1); no pairing
	status      cellular    partial   the modem boots and registers (LTE/UMTS), the stock cellular page through ctshimd; no calls, SMS or mobile data
	status      network     partial   Wi-Fi as above; mobile data (IPA) missing
	status      usb         partial   the loader's USB channel and the kernel's control channel (xl sh, screenshots); stalls under load
	status      sensors     missing   no accelerometer through the SLPI (no registry, FastRPC); no auto-rotate; GNSS: no fix
